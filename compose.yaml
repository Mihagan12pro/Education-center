services:
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usersDb
    ports:
      - "5442:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d usersDb" ]
      interval: 5s
      timeout: 5s
      retries: 5
      
volumes:
  pg_users_data:
      

